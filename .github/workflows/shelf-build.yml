name: Pocket Shelf build

# Builds the release VPK and attaches it to the run as the `pocket-shelf-vpk`
# artifact. shelf-release.yml and shelf-nightly.yml call it and publish the
# result; run it by hand (Actions ▸ Pocket Shelf build ▸ Run workflow) to check
# a build without publishing anything.
#
# It also runs on every push to main. GitHub lets a run restore caches saved on
# its own branch or on the default branch only, so main's run is what gives
# releases (tags) and pull request branches a warm cache: the Vita standard
# library, the dependencies and cargo-vita, instead of building them again.
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  VITASDK: /home/runner/vitasdk
  VDPM_NONINTERACTIVE: "1"
  # The toolchain pinned in vita/rust-toolchain.toml and vita/build.sh.
  VITA_RUST: nightly-2026-05-28
  CARGO_VITA_VERSION: 0.2.2

jobs:
  vpk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install VitaSDK
        run: |
          git clone --depth 1 https://github.com/vitasdk/vdpm /tmp/vdpm
          (cd /tmp/vdpm && ./bootstrap-vitasdk.sh)
          "$VITASDK/bin/vdpm" install libvita2d taihen
          echo "$VITASDK/bin" >> "$GITHUB_PATH"

      # The pinned nightly, its rust-src included, restored with its files'
      # times: installed fresh, the standard library's sources were newer
      # than every cached build, and cargo rebuilt std and all 120 crates on
      # top of it each run.
      - uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains/${{ env.VITA_RUST }}-x86_64-unknown-linux-gnu
          key: rustup-${{ env.VITA_RUST }}

      - name: Install Rust
        run: |
          rustup toolchain install "$VITA_RUST" --profile minimal --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for every caller (this workflow, release, nightly), and
          # ~/.cargo/bin in it, so cargo-vita is restored rather than built.
          shared-key: shelf-vpk
          cache-bin: true
          # The key names the Vita toolchain (`key` below). The default hash
          # of the runner's own Rust install flips between runner images
          # (8ad8a653, d4976175), and a run missed the cache the run before
          # it saved; cargo rebuilds what a different compiler made anyway.
          add-rust-environment-hash-key: false
          workspaces: |
            core -> target
            platform-tests -> target
            tools -> target
          key: ${{ env.VITA_RUST }}

      # The Vita build's target folder (the standard library and the
      # dependencies built for armv7-sony-vita), whole: the rust-cache step
      # above keeps the desktop crates'. The newest one for this toolchain and
      # lockfile is restored; the app's own crates rebuild from the checkout.
      - uses: actions/cache@v4
        with:
          path: vita/target
          key: vita-target-${{ env.VITA_RUST }}-${{ hashFiles('vita/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            vita-target-${{ env.VITA_RUST }}-${{ hashFiles('vita/Cargo.lock') }}-
            vita-target-${{ env.VITA_RUST }}-

      - name: Install cargo-vita
        run: |
          if ! cargo vita --version 2>/dev/null | grep -q "$CARGO_VITA_VERSION"; then
            cargo +"$VITA_RUST" install cargo-vita --version "$CARGO_VITA_VERSION" --locked --force
          fi

      # Core, platform module and tools tests on the runner's own Rust, then
      # the VPK (vita/build.rs reads the tag from GITHUB_REF_NAME).
      - run: make test
      - run: make build

      - uses: actions/upload-artifact@v7
        with:
          name: pocket-shelf-vpk
          path: dist/vita/pocket-shelf.vpk
          if-no-files-found: error

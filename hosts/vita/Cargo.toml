[package]
name = "pocketjs-vita"
version = "0.1.0"
edition = "2021"

[dependencies]
# Vita dependencies. vita2d ships precompiled GXM shaders, so VPKs remain
# self-contained and do not require a separately extracted libshacccg.suprx.
vitasdk-sys = { version = "0.3.3", features = ["SceAudio_stub", "SceCtrl_stub", "SceGxm_stub", "SceKernelModulemgr_stub", "SceKernelThreadMgr_stub", "SceLibKernel_stub", "SceNet_stub", "SceNetCtl_stub", "SceSysmodule_stub", "SceTouch_stub"] }
vita2d-sys = "0.1.1"
# Decodes each title's icon0.png; built only with `installed-apps`.
png = { version = "0.17", optional = true }

# TLS for `http`. The Vita's own SceSsl cannot negotiate with servers that
# present an ECDSA certificate, so the host carries a TLS stack in Rust.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"], optional = true }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true }
webpki-roots = { version = "1", optional = true }

# File access for apps (globalThis.fs); built only with `data-fs`.
pocket-fs = { path = "../../engine/crates/pocket-fs", default-features = false, optional = true }

libquickjs-sys = { git = "https://github.com/pocket-nexus/quickjs-rs.git", rev = "ba5bdd0dc013518768e76cd9e05cd30ed53dd35b" }
pocketjs-core = { path = "../../engine/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
usb-debug = ["vitasdk-sys/ScePower_stub", "vitasdk-sys/SceSysmem_stub"]
# Native app navigation (docs/LAUNCHER.md): appTable/appLaunch list and start
# the titles installed under ux0:/app. Opt-in per VPK, because a native table
# makes the framework treat the guest as launcher-hosted.
installed-apps = ["vitasdk-sys/SceAppMgr_stub", "vitasdk-sys/SceSqlite_stub", "dep:png"]
# globalThis.fs over ux0:/data/pocketjs/<title id>.
data-fs = ["dep:pocket-fs"]
# ui.__status() for a status bar (src/status.rs): local time and clock
# format, battery, Wi-Fi and Bluetooth.
status = ["vitasdk-sys/SceAppUtil_stub", "vitasdk-sys/ScePower_stub", "vitasdk-sys/SceRegistryMgr_stub", "vitasdk-sys/SceRtc_stub"]
# HTTPS GET for apps (src/http.rs): text replies and PNG downloads into the
# data folder.
http = ["data-fs", "dep:rustls", "dep:rustls-rustcrypto", "dep:webpki-roots"]
capture = []
bench = []

[package.metadata.vita]
# The Vita backend supplies VITA_DEFAULT_TITLE_ID from pocket.json. Keeping the
# reusable runtime free of a static id prevents separate apps from replacing
# one another on real hardware and in Vita3K.
title_name = "PocketJS"
# tools/vita-package.ts owns the final VPK asset merge. Keeping cargo-vita's
# intermediate package asset-free prevents a second, divergent packaging path.

# vita-elf-create consumes sceUserMainThreadStackSize from the ELF symbol
# table. The release default strips that symbol before conversion and falls
# back to Vita's 4 KiB stack, which is too small for QuickJS.
[package.metadata.vita.profile.release]
strip_symbols = false
